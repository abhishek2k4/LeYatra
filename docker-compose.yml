services:
  mongodb:
    image: mongo:8.0
    container_name: leyatra-mongodb
    restart: unless-stopped

    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]

    ports:
      - "127.0.0.1:27017:27017"

    volumes:
      - leyatra_mongodb_data:/data/db

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  leyatra_mongodb_data: